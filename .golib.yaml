schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
operations:
- module: "."
  gate: local-test
  steps:
  - type: go-test
    packages: ["."]
    run: '^Test(OutstandingBudgetBoundsSharedConcurrentHedges|DelayedHedgeWinsCancelsAndDisposesOriginal|CallerCancellationAfterTotalDeadlineStopsScheduledTimer)$'
    race: true
    count: 1
    timeout: 2m
- module: "."
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: api
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: architecture
    timeout: 20m
  - type: go-test
    packages: ["."]
    run: '^(TestInternalDeterministicSelectionAndCauses|TestExactSuccessTiesChooseLowestOrdinalForEveryPublishedPermutation|TestPublishedResultAtDelayBoundaryPrecedesAdditionalWork|TestScheduledDelaysLaunchEachBoundedHedge)$'
    count: 20
    timeout: 20m
  - type: go-test
    packages: ["."]
    run: '^(TestFactoryOriginalFailuresAreBounded|TestAttemptAndClassifierExceptionalResultsAreTerminal|TestDynamicDelayFailureStopsScheduledWork|TestDynamicDelayPanicStopsScheduledWork|TestCleanupFailureAndUncooperativeAttemptRemainObservable|TestDisposerPanicIsReportedAsCleanupFailure|TestObserverPanicDoesNotChangeExecution)$'
    count: 1
    timeout: 20m
  - type: go-test
    packages: ["."]
    run: '^TestNoPackageBackgroundWorkers$'
    count: 10
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: clean-consumer
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: dependencies
    timeout: 20m
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPolicyValidationRejectsUnsafeBounds$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzOutstandingBudgetNeverExceedsLimit$'
    budget: 2s
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["."]
    benchmark: "Benchmark"
    budget: 100ms
    timeout: 20m
